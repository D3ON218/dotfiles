general {
    lock_cmd = pidof hyprlock || hyprlock       # evita lanzar múltiples instancias
    before_sleep_cmd = loginctl lock-session    # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # encender pantalla al despertar
}

# REGLA PARA BATERÍA (600 segundos = 10 minutos)
listener {
    timeout = 600
    on-timeout = bash -c "[[ $(cat /sys/class/power_supply/AC*/online) -eq 0 ]] && hyprlock"
}

# REGLA PARA CORRIENTE (1800 segundos = 30 minutos)
listener {
    timeout = 1800
    on-timeout = hyprlock
}

# APAGAR PANTALLA (Para ahorrar energía después de bloquear)
listener {
    timeout = 1860
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}general {
    lock_cmd = ~/scripts/smart-lock.sh
    before_sleep_cmd = loginctl lock-session
}

# REGLA PARA BATERÍA (10 Minutos)
listener {
    timeout = 600
    # Verifica si la laptop NO está cargando antes de ejecutar
    on-timeout = bash -c "[[ $(cat /sys/class/power_supply/AC*/online) -eq 0 ]] && ~/scripts/smart-lock.sh"
}

# REGLA PARA CORRIENTE (30 Minutos)
listener {
    timeout = 1800
    on-timeout = ~/scripts/smart-lock.sh
}

# ATENUAR PANTALLA (Aviso visual 30 segundos antes de bloquear)
listener {
    timeout = 570
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}